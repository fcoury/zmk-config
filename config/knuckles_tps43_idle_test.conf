CONFIG_KNUCKLES_TPS43_IDLE_POLLING=y
CONFIG_KNUCKLES_TPS43_IDLE_POLL_INTERVAL_MS=250
# Keep the usual 30 s idle / 15 min deep-sleep thresholds for comparison.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
