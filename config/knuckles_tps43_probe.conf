# Use with zmk-usb-logging and knuckles_tps43_probe.overlay.
# Expose the I2C bus for diagnosis without concurrent TPS43 driver accesses.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_SENSOR_SHELL=n
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n
