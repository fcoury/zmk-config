# Enable the pointing stack and the Azoteq IQS5xx driver.
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y

CONFIG_I2C=y
CONFIG_I2C_NRFX=y

# GPIO
CONFIG_GPIO=y
CONFIG_PINCTRL=y

# Keep the input listener infrastructure on (selected by ZMK_POINTING when available).
CONFIG_ZMK_INPUT_LISTENER=y

# Logging (keep minimal, no USB debug)
CONFIG_LOG=y
CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_RTT_LOGGING=n
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
